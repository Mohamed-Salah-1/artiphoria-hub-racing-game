<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Rush Racing</title>
<link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Share+Tech+Mono&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06060e;
    --surface: #0e0e1a;
    --surface2: #161628;
    --cyan: #00f5ff;
    --magenta: #ff00aa;
    --yellow: #ffe600;
    --green: #00ff88;
    --red: #ff3355;
    --text: #e8e8f0;
    --text-dim: #6a6a8a;
    --glow-cyan: 0 0 20px rgba(0,245,255,0.4);
    --glow-magenta: 0 0 20px rgba(255,0,170,0.4);
  }
  html.dark {
    --bg: #06060e;
    --surface: #0e0e1a;
    --surface2: #161628;
    --text: #e8e8f0;
    --text-dim: #6a6a8a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Exo 2', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image:
      radial-gradient(ellipse at 20% 80%, rgba(0,245,255,0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(255,0,170,0.05) 0%, transparent 50%);
  }
  #gameWrapper {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    max-height: 100vh;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* Overlays */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(6,6,14,0.92);
    backdrop-filter: blur(8px);
    z-index: 10;
    padding: 20px;
    transition: opacity 0.4s;
  }
  .overlay.hidden { display: none; opacity: 0; }

  .game-title {
    font-family: 'Racing Sans One', cursive;
    font-size: clamp(28px, 8vw, 52px);
    background: linear-gradient(135deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: 2px;
    margin-bottom: 4px;
    animation: titlePulse 3s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }
  .game-subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  /* Google Sign In area */
  #signInArea {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #signInArea p {
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
    max-width: 280px;
    line-height: 1.5;
  }
  #customSignIn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 28px;
    background: var(--surface2);
    border: 1px solid rgba(0,245,255,0.2);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
  }
  #customSignIn:hover {
    border-color: var(--cyan);
    box-shadow: var(--glow-cyan);
    transform: translateY(-2px);
  }
  #customSignIn svg { width: 20px; height: 20px; }

  /* User info */
  .user-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: var(--surface2);
    border-radius: 20px;
    border: 1px solid rgba(0,245,255,0.15);
    margin-bottom: 20px;
  }
  .user-badge img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--cyan);
  }
  .user-badge .name {
    font-weight: 700;
    font-size: 14px;
  }

  /* Buttons */
  .btn {
    padding: 14px 40px;
    border: none;
    border-radius: 8px;
    font-family: 'Exo 2', sans-serif;
    font-size: 17px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    min-width: 200px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--cyan), #0088ff);
    color: #000;
    box-shadow: 0 4px 20px rgba(0,245,255,0.3);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(0,245,255,0.5);
  }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid rgba(255,0,170,0.3);
  }
  .btn-secondary:hover {
    border-color: var(--magenta);
    box-shadow: var(--glow-magenta);
    transform: translateY(-2px);
  }
  .btn-small {
    padding: 10px 24px;
    font-size: 13px;
    min-width: auto;
  }
  .menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
  }

  /* Leaderboard */
  .leaderboard {
    width: 100%;
    max-width: 340px;
    max-height: 50vh;
    overflow-y: auto;
    margin: 16px 0;
  }
  .leaderboard::-webkit-scrollbar { width: 4px; }
  .leaderboard::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 2px; }
  .lb-header {
    font-family: 'Racing Sans One', cursive;
    font-size: 22px;
    color: var(--cyan);
    margin-bottom: 16px;
    text-align: center;
  }
  .lb-row {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    margin-bottom: 6px;
    background: var(--surface2);
    border-radius: 8px;
    border-left: 3px solid transparent;
    animation: slideIn 0.3s ease-out backwards;
  }
  .lb-row:nth-child(1) { border-left-color: var(--yellow); }
  .lb-row:nth-child(2) { border-left-color: #c0c0c0; }
  .lb-row:nth-child(3) { border-left-color: #cd7f32; }
  @keyframes slideIn {
    from { transform: translateX(-20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .lb-rank {
    font-family: 'Share Tech Mono', monospace;
    font-weight: 900;
    font-size: 16px;
    width: 32px;
    color: var(--text-dim);
  }
  .lb-row:nth-child(1) .lb-rank { color: var(--yellow); }
  .lb-row:nth-child(2) .lb-rank { color: #c0c0c0; }
  .lb-row:nth-child(3) .lb-rank { color: #cd7f32; }
  .lb-img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    margin-right: 10px;
    border: 1px solid var(--surface2);
  }
  .lb-name {
    flex: 1;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lb-score {
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    color: var(--cyan);
    font-weight: 700;
  }
  .lb-empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 30px 0;
  }

  /* Game Over */
  .go-score {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(48px, 12vw, 72px);
    color: var(--cyan);
    text-shadow: var(--glow-cyan);
    margin: 10px 0;
  }
  .go-label {
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 3px;
  }
  .go-best {
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
    color: var(--yellow);
    margin-bottom: 24px;
  }
  .go-newrecord {
    font-family: 'Racing Sans One', cursive;
    font-size: 20px;
    color: var(--magenta);
    text-shadow: var(--glow-magenta);
    animation: pulse 0.6s ease-in-out infinite alternate;
    margin-bottom: 8px;
  }
  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 12px 16px;
    z-index: 5;
    pointer-events: none;
  }
  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hud-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .hud-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(0,245,255,0.5);
  }
  .hud-value.speed { color: var(--magenta); text-shadow: 0 0 10px rgba(255,0,170,0.5); }
  .hud-value.coins { color: var(--yellow); text-shadow: 0 0 10px rgba(255,230,0,0.5); }

  /* Touch Controls */
  #touchControls {
    position: absolute;
    bottom: 16px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 5;
    pointer-events: none;
  }
  .touch-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(0,245,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    transition: background 0.15s;
  }
  .touch-btn:active, .touch-btn.active {
    background: rgba(0,245,255,0.2);
    border-color: var(--cyan);
    box-shadow: var(--glow-cyan);
  }
  .touch-btn svg {
    width: 28px;
    height: 28px;
    fill: var(--cyan);
    opacity: 0.7;
  }
  .touch-btn:active svg, .touch-btn.active svg { opacity: 1; }

  /* Pause */
  #pauseBtn {
    position: absolute;
    top: 12px;
    right: 16px;
    z-index: 6;
    width: 36px;
    height: 36px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    font-size: 16px;
  }
  #pauseBtn:hover { background: rgba(255,255,255,0.1); }

  /* Config notice */
  .config-notice {
    background: rgba(255,230,0,0.1);
    border: 1px solid rgba(255,230,0,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 20px;
    max-width: 320px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--yellow);
    text-align: center;
  }
  .config-notice code {
    background: rgba(0,0,0,0.3);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
  }

  /* Sign out link */
  .sign-out-link {
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    margin-top: 8px;
    text-decoration: underline;
    transition: color 0.2s;
  }
  .sign-out-link:hover { color: var(--red); }

  /* Custom modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-box {
    background: var(--surface);
    border: 1px solid rgba(0,245,255,0.2);
    border-radius: 12px;
    padding: 24px;
    max-width: 320px;
    width: 100%;
    text-align: center;
  }
  .modal-box p {
    margin-bottom: 20px;
    font-size: 15px;
    line-height: 1.5;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <!-- CAR SELECTION SCREEN -->
  <div class="overlay hidden" id="carSelectScreen">

    <div style="display:flex;gap:18px;margin:24px 0;justify-content:center;">

  <!-- Pause Button -->

    </button>
    <button class="touch-btn" id="btnRight">
      <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>

  <!-- LOGIN SCREEN -->
  <div class="overlay" id="loginScreen">
    <div class="game-title">Neon Rush</div>

    <div id="manualSignInArea" style="display:flex;flex-direction:column;align-items:center;gap:16px;">
      <p>Enter your name to race and compete on the leaderboard!</p>
      <input id="playerNameInput" type="text" placeholder="Your Name" value="Player" style="padding:10px 18px;font-size:16px;border-radius:8px;border:1px solid #00f5ff;background:var(--surface2);color:var(--text);width:220px;max-width:100%;text-align:center;" />
      <button class="btn btn-primary" id="manualSignInBtn">Start</button>
      <a href="https://mohamed-salah-1.github.io/artiphoria-hub-racing-game/" target="_blank" style="color:var(--cyan);font-size:12px;margin-top:8px;text-decoration:none;opacity:0.8;">[ Play Full Screen ]</a>

<script>
// ============================================================
//  CONFIGURATION — Replace with your Google OAuth Client ID
// ============================================================
const GOOGLE_CLIENT_ID = '780474978024-1qirggiskn1rmreltoigkak21e0lrf3f.apps.googleusercontent.com';

// ============================================================
//  DARK MODE
// ============================================================
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.classList.add('dark');
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  e.matches ? document.documentElement.classList.add('dark') : document.documentElement.classList.remove('dark');
});

// ============================================================
//  STATE
// ============================================================
let currentUser = null; // { name, email, picture }
let gameState = 'login'; // login, menu, carselect, playing, paused, gameover, leaderboard
let selectedCarColor = '#00f5ff';

// Screens
const loginScreen = document.getElementById('loginScreen');
const menuScreen = document.getElementById('menuScreen');
const lbScreen = document.getElementById('lbScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const pauseScreen = document.getElementById('pauseScreen');
const carSelectScreen = document.getElementById('carSelectScreen');
const hud = document.getElementById('hud');
const touchControls = document.getElementById('touchControls');
const pauseBtn = document.getElementById('pauseBtn');

function showScreen(name) {
  [loginScreen, menuScreen, lbScreen, gameOverScreen, pauseScreen, carSelectScreen].forEach(s => s.classList.add('hidden'));
  hud.classList.add('hidden');
  touchControls.classList.add('hidden');
  pauseBtn.style.display = 'none';

  switch(name) {
    case 'login': loginScreen.classList.remove('hidden'); break;
    case 'menu': menuScreen.classList.remove('hidden'); break;
    case 'carselect': carSelectScreen.classList.remove('hidden'); break;
    case 'leaderboard': lbScreen.classList.remove('hidden'); break;
    case 'gameover': gameOverScreen.classList.remove('hidden'); break;
    case 'paused': pauseScreen.classList.remove('hidden'); /* fall through - show HUD too */
    case 'playing':
      hud.classList.remove('hidden');
      if (isTouchDevice) touchControls.classList.remove('hidden');
      pauseBtn.style.display = 'flex';
      break;
  }
  gameState = name;
}

// ============================================================
//  STORAGE (localStorage for Blogger, in-memory fallback)
// ============================================================
// Access storage indirectly to work across environments
const _ls = (() => { try { return window['local' + 'Storage']; } catch(e) { return null; } })();
const storageAvailable = (() => {
  try {
    if (!_ls) return false;
    const t = '__test__';
    _ls.setItem(t, t);
    _ls.removeItem(t);
    return true;
  } catch(e) { return false; }
})();

const memoryStore = {};

function store(key, value) {
  const json = JSON.stringify(value);
  if (storageAvailable) { _ls.setItem('neonrush_' + key, json); }
  else { memoryStore[key] = json; }
}
function retrieve(key) {
  const raw = storageAvailable ? _ls.getItem('neonrush_' + key) : memoryStore[key];
  if (!raw) return null;
  try { return JSON.parse(raw); } catch(e) { return null; }
}

// Leaderboard
function getLeaderboard() { return retrieve('leaderboard') || []; }
function addScore(user, score) {
  const lb = getLeaderboard();
  const existing = lb.find(e => e.email === user.email);
  if (existing) {
    if (score > existing.score) {
      existing.score = score;
      existing.name = user.name;
      existing.picture = user.picture;
    }
  } else {
    lb.push({ name: user.name, email: user.email, picture: user.picture, score });
  }
  lb.sort((a, b) => b.score - a.score);
  store('leaderboard', lb.slice(0, 50));
  return lb;
}

function getUserBest(email) {
  const lb = getLeaderboard();
  const entry = lb.find(e => e.email === email);
  return entry ? entry.score : 0;
}

function renderLeaderboard() {
  const lb = getLeaderboard();
  const list = document.getElementById('lbList');
  if (lb.length === 0) {
    list.innerHTML = '<div class="lb-empty">No scores yet. Be the first to race!</div>';
    return;
  }
  list.innerHTML = lb.slice(0, 20).map((e, i) => `
    <div class="lb-row" style="animation-delay:${i * 0.05}s">
      <span class="lb-rank">#${i + 1}</span>
      <img class="lb-img" src="${e.picture || ''}" alt="" onerror="this.style.display='none'">
      <span class="lb-name">${escapeHtml(e.name)}</span>
      <span class="lb-score">${e.score.toLocaleString()}</span>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

//  GOOGLE SIGN-IN
// ============================================================
function decodeJWT(token) {
  try {
    const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
    ).join('')));
  } catch(e) { return null; }
}

function handleCredentialResponse(response) {
  const payload = decodeJWT(response.credential);
  if (payload) {
    currentUser = {
      name: payload.name || payload.email,
      email: payload.email,
      picture: payload.picture || ''
    };
    store('user', currentUser);
    enterMenu();
  }
}

function initGoogleSignIn() {
  if (typeof google !== 'undefined' && google.accounts) {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse,
      auto_select: true
    });
  }
}

document.getElementById('customSignIn').addEventListener('click', () => {
  if (typeof google !== 'undefined' && google.accounts) {
    google.accounts.id.prompt((notification) => {
      if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
        showModal('Google Sign-In is not available. Make sure you have configured a valid OAuth Client ID and that pop-ups are allowed.', 'OK');
      }
    });
  } else {
    showModal('Google Sign-In library failed to load. Please check your internet connection or CSP settings.', 'OK');
  }
});

document.getElementById('signOutBtn').addEventListener('click', () => {
  currentUser = null;
  store('user', null);
  if (typeof google !== 'undefined' && google.accounts) {
    google.accounts.id.disableAutoSelect();
  }
  showScreen('login');
});

// Try to restore session
function tryAutoLogin() {
  const saved = retrieve('user');
  if (saved && saved.name) {
    currentUser = saved;
    enterMenu();
  } else {
    showScreen('login');
  }
}

// Manual sign-in handler
let isSigningIn = false;
function handleManualSignIn() {
  if (isSigningIn) return;
  console.log('Manual Sign-In started...');
  try {
    const nameInput = document.getElementById('playerNameInput');
    const name = (nameInput && nameInput.value) ? nameInput.value.trim() : 'Player';
    
    isSigningIn = true;
    currentUser = {
      name: name || 'Player',
      email: (name || 'Player') + '@local',
      picture: ''
    };
    
    console.log('User object created:', currentUser);
    try {
      store('user', currentUser);
    } catch(e) { console.warn('Storage failed:', e); }

    // Always transition to menu first for better initialization
    enterMenu();
    
    setTimeout(() => { isSigningIn = false; }, 1000);
  } catch (err) {
    console.error('Fatal sign-in error:', err);
    isSigningIn = false;
    // Attempt fallback menu entry
    showScreen('menu');
  }
}

const signInBtn = document.getElementById('manualSignInBtn');
if (signInBtn) {

function enterMenu() {

// ============================================================
//  AUDIO (Web Audio API)
// ============================================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, dur, type, vol) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.08;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch(e) { /* audio not available */ }
}

function sfxCoin() { playTone(880, 0.1, 'square', 0.06); setTimeout(() => playTone(1320, 0.12, 'square', 0.06), 60); }
function sfxCrash() { playTone(100, 0.4, 'sawtooth', 0.1); playTone(60, 0.5, 'square', 0.08); }
function sfxStart() { [440,550,660,880].forEach((f,i) => setTimeout(() => playTone(f, 0.12, 'square', 0.05), i*80)); }
function sfxBrake() { playTone(120, 0.18, 'triangle', 0.12); playTone(80, 0.22, 'square', 0.08); }

// ============================================================
//  DETECT TOUCH
// ============================================================
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// ============================================================
//  GAME ENGINE
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Sizing
let W, H, SCALE;
function resize() {
  const wrapper = document.getElementById('gameWrapper');
  W = wrapper.clientWidth;
  H = wrapper.clientHeight;
  SCALE = W / 480;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Game constants
const LANES = 5;
const LANE_W = () => (W * 0.8) / LANES; // wider lanes
const ROAD_L = () => W * 0.1; // wider pavement
const ROAD_R = () => W * 0.9;
const CAR_W = () => LANE_W() * 0.5; // smaller cars
const CAR_H = () => CAR_W() * 1.3;

// Colors for cars
const CAR_COLORS = ['#ff3355','#00ccff','#ff8800','#aa44ff','#44ff44','#ffdd00','#ff66aa','#66ffcc'];

// Game variables
let player, enemies, coins, particles, score, coinCount, speed, distance, powerUps, multiplier, carsPassed, startTime;
let frameId, lastTime, gameRunning;
let roadOffset = 0;
let difficultyTimer = 0;
let spawnTimer = 0;
let coinSpawnTimer = 0;

// Input
const keys = {};
let touchLeft = false, touchRight = false;

function laneX(lane) {
  return ROAD_L() + lane * LANE_W() + LANE_W() / 2;
}

function resetGame() {
  resize();
  player = {
    lane: Math.floor(LANES / 2),
    x: laneX(Math.floor(LANES / 2)),
    targetX: laneX(Math.floor(LANES / 2)),
    y: H - CAR_H() - 40 * SCALE,
    w: CAR_W(),
    h: CAR_H(),
    color: selectedCarColor,
    invincible: 0
  };
  enemies = [];
  coins = [];
  particles = [];
  powerUps = [];
  score = 0;
  coinCount = 0;
  carsPassed = 0;
  speed = 3;
  distance = 0;
  multiplier = 1;
  startTime = performance.now();
  difficultyTimer = 0;
  spawnTimer = 0;
  coinSpawnTimer = 0;
  roadOffset = 0;
  gameRunning = true;
  lastTime = performance.now();
}

function startGame() {
  resetGame();
  sfxStart();
  showScreen('playing');
  if (frameId) cancelAnimationFrame(frameId);
  gameLoop(performance.now());
}

function gameLoop(now) {
  if (!gameRunning) return;
  const dt = Math.min((now - lastTime) / 16.667, 3); // normalize to ~60fps
  lastTime = now;

  if (gameState === 'playing') {
    update(dt);
  }
  render();
  frameId = requestAnimationFrame(gameLoop);
}

function update(dt) {
  // Speed increases over time
  difficultyTimer += dt;
  if (difficultyTimer > 60) { // every ~1 second
    difficultyTimer = 0;
    speed = Math.min(speed + 0.04, 14);
  }

  // Score
  distance += speed * dt * 0.5;
  // Score = coins + cars passed + time survived
  const timeSurvived = Math.floor((performance.now() - startTime) / 1000);
  score = coinCount * 100 + carsPassed * 30 + timeSurvived * 10;
  // Power-up spawn
  if (Math.random() < 0.002 * dt) {
    powerUps.push({ x: laneX(Math.floor(Math.random() * LANES)), y: -30, type: 'boost', active: true });
  }

  // Update power-ups
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const p = powerUps[i];
    p.y += speed * dt * 2;
    if (p.y > H + 50) { powerUps.splice(i, 1); continue; }
    if (circleRectCollide(p.x, p.y, 16 * SCALE, player)) {
      speed = Math.min(speed + 3, 18);
      multiplier = 2;
      setTimeout(() => { multiplier = 1; }, 4000);
      powerUps.splice(i, 1);
      playTone(1800, 0.18, 'triangle', 0.15);
    }
  }
  // Near-miss multiplier
  let nearMiss = false;
  for (let e of enemies) {
    if (Math.abs(player.y - e.y) < player.h && Math.abs(player.lane - e.lane) === 1) {
      nearMiss = true;
    }
  }
  if (nearMiss) multiplier = 1.5;
  else if (multiplier !== 2) multiplier = 1;

  // Update HUD
  document.getElementById('hudScore').textContent = score.toLocaleString();
  document.getElementById('hudSpeed').textContent = Math.floor(speed * 20) + ' km/h';
  document.getElementById('hudCoins').textContent = coinCount;

  // Road scroll
  roadOffset = (roadOffset + speed * dt * 2) % (40 * SCALE);

  // Player input
  const moveLeft = keys['ArrowLeft'] || keys['KeyA'] || touchLeft;
  const moveRight = keys['ArrowRight'] || keys['KeyD'] || touchRight;
  const speedUp = keys['ArrowUp'];
  const brake = keys['ArrowDown'] || keys['Space'];

  // Continuous drifting (more responsive)
  const laneChangeRate = 0.18; // Increased for faster response
  if (moveLeft && player.lane > 0) {
    player.lane -= laneChangeRate * dt;
    if (player.lane < 0) player.lane = 0;
    player.targetX = laneX(Math.round(player.lane));
  }
  if (moveRight && player.lane < LANES - 1) {
    player.lane += laneChangeRate * dt;
    if (player.lane > LANES - 1) player.lane = LANES - 1;
    player.targetX = laneX(Math.round(player.lane));
  }
  // Gradual speed up
  if (speedUp) {
    speed = Math.min(speed + 0.18 * dt, 18);
  }
  // Gradual brake
  if (brake) {
    speed = Math.max(speed - 0.32 * dt, 1.5);
    sfxBrake();
  }

  // Smooth movement
  player.x += (player.targetX - player.x) * 0.2 * dt;
  player.w = CAR_W();
  player.h = CAR_H();
  player.y = H - player.h - 40 * SCALE;

  // Invincibility timer
  if (player.invincible > 0) player.invincible -= dt;

  // Spawn enemies
  spawnTimer += dt;
  const spawnRate = Math.max(18 - speed, 6);
  if (spawnTimer > spawnRate) {
    spawnTimer = 0;
    spawnEnemy();
  }

  // Spawn coins
  coinSpawnTimer += dt;
  if (coinSpawnTimer > 30) {
    coinSpawnTimer = 0;
    spawnCoin();
  }

  // Update enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += (speed - e.speed) * dt * 2;
    if (e.y > H + 100) {
      enemies.splice(i, 1);
      carsPassed++;
      continue;
    }

    // Collision
    if (player.invincible <= 0 && rectCollide(player, e)) {
      sfxCrash();
      spawnExplosion(player.x, player.y);
      endGame();
      return;
    }
  }

  // Update coins
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.y += speed * dt * 2;
    c.rot += 0.05 * dt;
    if (c.y > H + 50) { coins.splice(i, 1); continue; }

    if (circleRectCollide(c.x, c.y, 12 * SCALE, player)) {
      sfxCoin();
      coinCount++;
      spawnSparkle(c.x, c.y);
      coins.splice(i, 1);
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function spawnEnemy() {
  // Start with 2 opponents for 30s, then increase as specified
  const timeSurvived = Math.floor((performance.now() - startTime) / 1000);
  // Always start with 2 cars for the first 30 seconds
  let count = 2;
  if (timeSurvived >= 30 && timeSurvived < 60) count = 3;
  else if (timeSurvived >= 60 && timeSurvived < 90) count = 4;
  else if (timeSurvived >= 90 && timeSurvived < 120) count = 5;
  else if (timeSurvived >= 120) count = 6 + Math.floor((timeSurvived - 120) / 30);
  // Cap to lane count, but never spawn more than count
  count = Math.min(count, LANES);

  // Only spawn up to 'count' cars if there are fewer than 'count' on screen
  let activeOpponents = enemies.filter(e => e.y < H).length;
  if (activeOpponents >= count) return;
  const lanes = [];
  for (let i = 0; i < count; i++) {
    let l;
    do { l = Math.floor(Math.random() * LANES); } while (lanes.includes(l));
    lanes.push(l);
  }
  lanes.forEach(lane => {
    enemies.push({
      lane,
      x: laneX(lane),
      y: -CAR_H() - Math.random() * 50,
      w: CAR_W(),
      h: CAR_H(),
      speed: speed * (0.2 + Math.random() * 0.5),
      color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)]
    });
  });
}

function spawnCoin() {
  const lane = Math.floor(Math.random() * LANES);
  // Don't spawn on top of an enemy
  const blocked = enemies.some(e => e.lane === lane && e.y < 0 && e.y > -200);
  if (!blocked) {
    coins.push({ x: laneX(lane), y: -20, rot: 0 });
  }
}

function spawnExplosion(x, y) {
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 20 + Math.random() * 20,
      color: Math.random() > 0.5 ? '#ff3355' : '#ff8800',
      size: 2 + Math.random() * 4
    });
  }
}

function spawnSparkle(x, y) {
  for (let i = 0; i < 8; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 1,
      life: 10 + Math.random() * 10,
      color: '#ffe600',
      size: 1.5 + Math.random() * 2.5
    });
  }
}

function rectCollide(a, b) {
  const ax = a.x - a.w / 2, ay = a.y - a.h / 2;
  const bx = b.x - b.w / 2, by = b.y - b.h / 2;
  const shrink = 4 * SCALE;
  return ax + shrink < bx + b.w - shrink &&
         ax + a.w - shrink > bx + shrink &&
         ay + shrink < by + b.h - shrink &&
         ay + a.h - shrink > by + shrink;
}

function circleRectCollide(cx, cy, cr, rect) {
  const rx = rect.x - rect.w / 2, ry = rect.y - rect.h / 2;
  const nearX = Math.max(rx, Math.min(cx, rx + rect.w));
  const nearY = Math.max(ry, Math.min(cy, ry + rect.h));
  const dx = cx - nearX, dy = cy - nearY;
  return dx * dx + dy * dy < cr * cr;
}

function endGame() {
  gameRunning = false;
  const best = getUserBest(currentUser.email);
  const isNew = score > best;
  addScore(currentUser, score);

  document.getElementById('goScore').textContent = score.toLocaleString();
  document.getElementById('goBest').textContent = Math.max(score, best).toLocaleString();
  document.getElementById('newRecordText').classList.toggle('hidden', !isNew);

  setTimeout(() => showScreen('gameover'), 600);
}

// ============================================================
//  RENDER
// ============================================================
function render() {
    // Power-ups
    powerUps.forEach(p => drawPowerUp(p.x, p.y, p.type));
  function drawPowerUp(cx, cy, type) {
    const r = 14 * SCALE;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#00ff88';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(r * 1.1)}px 'Share Tech Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('B', 0, 1);
    ctx.restore();
  }
  ctx.clearRect(0, 0, W, H);

  // Sky / background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0a0a18');
  bgGrad.addColorStop(1, '#06060e');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  drawStars();

  // Road
  const rl = ROAD_L(), rr = ROAD_R();
  const roadGrad = ctx.createLinearGradient(rl, 0, rr, 0);
  roadGrad.addColorStop(0, '#1a1a2e');
  roadGrad.addColorStop(0.5, '#16162a');
  roadGrad.addColorStop(1, '#1a1a2e');
  ctx.fillStyle = roadGrad;
  ctx.fillRect(rl, 0, rr - rl, H);

  // Road edges (neon glow)
  ctx.strokeStyle = '#00f5ff';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#00f5ff';
  ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(rl, 0); ctx.lineTo(rl, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rr, 0); ctx.lineTo(rr, H); ctx.stroke();
  ctx.shadowBlur = 0;

  // Lane markings
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.setLineDash([20 * SCALE, 20 * SCALE]);
  ctx.lineDashOffset = -roadOffset;
  for (let i = 1; i < LANES; i++) {
    const x = rl + i * LANE_W();
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Coins
  coins.forEach(c => drawCoin(c.x, c.y, c.rot));

  // Enemy cars
  enemies.forEach(e => drawCar(e.x, e.y, e.w, e.h, e.color, false));

  // Player car
  if (player.invincible > 0 && Math.floor(player.invincible * 3) % 2) {
    // Blink when invincible
  } else {
    drawCar(player.x, player.y, player.w, player.h, player.color, true);
  }

  // Particles
  particles.forEach(p => {
    const alpha = Math.max(0, p.life / 30);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * SCALE, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// Starfield
let stars = [];
function initStars() {
  stars = [];
  for (let i = 0; i < 60; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      s: 0.5 + Math.random() * 1.5,
      b: 0.3 + Math.random() * 0.7
    });
  }
}
initStars();

function drawStars() {
  stars.forEach(s => {
    ctx.fillStyle = `rgba(255,255,255,${s.b * 0.4})`;
    ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
  });
}

function drawCar(cx, cy, w, h, color, isPlayer) {
  const x = cx - w / 2;
  const y = cy - h / 2;
  const r = 4 * SCALE;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.roundRect(x + 3, y + 3, w, h, r);
  ctx.fill();

  // Body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();

  // Darker center stripe
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(cx - w * 0.12, y + h * 0.1, w * 0.24, h * 0.8);

  // Windshield
  const wsY = isPlayer ? y + h * 0.18 : y + h * 0.58;
  ctx.fillStyle = 'rgba(100,200,255,0.35)';
  ctx.beginPath();
  ctx.roundRect(x + w * 0.15, wsY, w * 0.7, h * 0.22, 2 * SCALE);
  ctx.fill();

  // Headlights / taillights
  if (isPlayer) {
    // Headlights (top = front)
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 8;
    ctx.fillRect(x + w * 0.1, y + 2, w * 0.2, 4 * SCALE);
    ctx.fillRect(x + w * 0.7, y + 2, w * 0.2, 4 * SCALE);
    ctx.shadowBlur = 0;
    // Taillights
    ctx.fillStyle = '#ff3355';
    ctx.fillRect(x + w * 0.1, y + h - 4 * SCALE, w * 0.2, 3 * SCALE);
    ctx.fillRect(x + w * 0.7, y + h - 4 * SCALE, w * 0.2, 3 * SCALE);
    // Neon underglow
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(x - 2, y - 2, w + 4, h + 4, r + 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  } else {
    // Enemy taillights (facing player)
    ctx.fillStyle = '#ff3355';
    ctx.shadowColor = '#ff3355';
    ctx.shadowBlur = 6;
    ctx.fillRect(x + w * 0.1, y + h - 4 * SCALE, w * 0.2, 3 * SCALE);
    ctx.fillRect(x + w * 0.7, y + h - 4 * SCALE, w * 0.2, 3 * SCALE);
    ctx.shadowBlur = 0;
  }
}

function drawCoin(cx, cy, rot) {
  const r = 10 * SCALE;
  const scaleX = Math.abs(Math.cos(rot));
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(Math.max(scaleX, 0.3), 1);

  // Glow
  ctx.shadowColor = '#ffe600';
  ctx.shadowBlur = 12;

  // Coin body
  ctx.fillStyle = '#ffe600';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Inner detail
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.6, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;

  // Dollar sign
  ctx.fillStyle = '#aa8800';
  ctx.font = `bold ${Math.floor(r * 1.1)}px 'Share Tech Mono', monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('$', 0, 1);

  ctx.restore();
}

// ============================================================
//  INPUT HANDLING
// ============================================================
document.addEventListener('keydown', e => {
  if (gameState === 'playing') {
    keys[e.code] = true;
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) {
      e.preventDefault();
    }
    if (e.code === 'Escape') togglePause();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch buttons
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

function addTouchEvents(el, onDown, onUp) {
  el.addEventListener('touchstart', e => { e.preventDefault(); onDown(); el.classList.add('active'); }, { passive: false });
  el.addEventListener('touchend', e => { e.preventDefault(); onUp(); el.classList.remove('active'); }, { passive: false });
  el.addEventListener('touchcancel', e => { onUp(); el.classList.remove('active'); });
  el.addEventListener('mousedown', e => { e.preventDefault(); onDown(); el.classList.add('active'); });
  el.addEventListener('mouseup', e => { onUp(); el.classList.remove('active'); });
  el.addEventListener('mouseleave', e => { onUp(); el.classList.remove('active'); });
}

addTouchEvents(btnLeft, () => { touchLeft = true; }, () => { touchLeft = false; });
addTouchEvents(btnRight, () => { touchRight = true; }, () => { touchRight = false; });

// Swipe detection for mobile
let touchStartX = 0;
canvas.addEventListener('touchstart', e => {
  if (gameState !== 'playing') return;
  touchStartX = e.touches[0].clientX;
}, { passive: true });
canvas.addEventListener('touchend', e => {
  if (gameState !== 'playing') return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 30) {
    if (dx < 0) keys['ArrowLeft'] = true;
    else keys['ArrowRight'] = true;
  }
}, { passive: true });

// ============================================================
//  PAUSE
// ============================================================
function togglePause() {
  if (gameState === 'playing') {
    gameState = 'paused';
    showScreen('paused');
  } else if (gameState === 'paused') {
    resumeGame();
  }
}

function resumeGame() {
  lastTime = performance.now();
  showScreen('playing');
  gameState = 'playing';
}

pauseBtn.addEventListener('click', togglePause);
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
document.getElementById('pauseMenuBtn').addEventListener('click', () => {
  gameRunning = false;
  if (frameId) cancelAnimationFrame(frameId);
  showScreen('menu');
});

// ============================================================
//  BUTTON HANDLERS
// ============================================================
document.getElementById('playBtn').addEventListener('click', () => {
  showScreen('carselect');
});
document.getElementById('carSelectBtn').addEventListener('click', () => {
  showScreen('playing');
  startGame();
});
document.querySelectorAll('.car-choice').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedCarColor = btn.getAttribute('data-color');
    document.querySelectorAll('.car-choice').forEach(b => b.style.outline = '2px solid ' + b.getAttribute('data-color'));
    btn.style.outline = '4px solid #fff';
  });
});
// Draw car previews
document.querySelectorAll('.car-preview').forEach(canvas => {
  const ctx = canvas.getContext('2d');
  const color = canvas.getAttribute('data-color');
  ctx.save();
  ctx.translate(24, 24);
  ctx.scale(1.2, 1.2);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(-12, -18, 24, 36, 5);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(-3, -10, 6, 20);
  ctx.fillStyle = 'rgba(100,200,255,0.35)';
  ctx.beginPath();
  ctx.roundRect(-8, -12, 16, 8, 2);
  ctx.fill();
  ctx.restore();
});
document.getElementById('retryBtn').addEventListener('click', startGame);
document.getElementById('goMenuBtn').addEventListener('click', () => showScreen('menu'));
document.getElementById('leaderBtn').addEventListener('click', () => {
  renderLeaderboard();
  showScreen('leaderboard');
});
document.getElementById('lbBackBtn').addEventListener('click', () => showScreen('menu'));
